  # ----------------------------------------
  # 3. FOLDER COLLECTIONS
  # ----------------------------------------
  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options:
            [
              "Transfers",
              "Local Travel",
              "Outstation Travel",
              "Group and Event Travel",
              "Additional",
            ],
        }
      - {
          label: "Summary",
          name: "summary",
          widget: "string",
          hint: "Max 160 characters for SEO cards",
        }
      - {
          label: "Image",
          name: "image",
          widget: "image",
          choose_url: false,
          required: false,
        }
      - {
          label: "Fallback Hero Badge (When Gallery has 0 images)",
          name: "heroBadge",
          widget: "string",
          required: false,
          hint: "Defaults to Category if left blank.",
        }
      - {
          label: "Fallback Hero Title (When Gallery has 0 images)",
          name: "heroTitle",
          widget: "string",
          required: false,
          hint: "Defaults to Title if left blank.",
        }
      - {
          label: "Fallback Hero Description (When Gallery has 0 images)",
          name: "heroDescription",
          widget: "text",
          required: false,
          hint: "Defaults to Summary if left blank.",
        }
      - label: "Service Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Add photos for the gallery. Check 'Set as Primary Image' on the photo you want displayed on service cards."
        fields:
          - { label: "Image", name: "url", widget: "image", choose_url: false }
          - {
              label: "Set as Primary Image (Show on Service Cards)",
              name: "isPrimary",
              widget: "boolean",
              default: false,
              required: false,
            }
      - {
          label: "Gallery Section Badge",
          name: "galleryBadge",
          widget: "string",
          required: false,
          default: "The Service, In Pictures",
        }
      - {
          label: "Gallery Section Title",
          name: "galleryTitle",
          widget: "string",
          required: false,
          hint: "Leave blank to default to '<Service Title> in pictures'",
        }
      - {
          label: "Gallery Section Description",
          name: "galleryDescription",
          widget: "text",
          required: false,
          default: "See the key moments in this service, from meeting your driver to arriving comfortably at your stay.",
        }
      - {
          label: "Sort Order",
          name: "sortOrder",
          widget: "number",
          default: 10,
        }
      - {
          label: "Published",
          name: "published",
          widget: "boolean",
          default: true,
        }

      # 1. Who This Is For
      - {
          label: "Who This Is For (Section Heading)",
          name: "whoIsThisForHeading",
          widget: "string",
          required: false,
          default: "Who this is for",
        }
      - {
          label: "Who This Is For (Description Text)",
          name: "whoIsThisForContent",
          widget: "text",
          required: false,
        }
      - {
          label: "Who This Is For (Pills)",
          name: "whoIsThisFor",
          widget: "list",
          required: false,
          hint: "Add short tags like 'Families & couples' or 'Solo travellers'",
        }

      # 2. What's Covered (2x2 Grid)
      - label: "What's Covered (Grid Items)"
        name: "whatsCovered"
        widget: "list"
        required: false
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
      - {
          label: "What's Covered Disclaimer / Note",
          name: "whatsCoveredNote",
          widget: "text",
          required: false,
          hint: "e.g., Coverage examples above are explanatory. Share your exact flight, hotel or route in the enquiry and we'll confirm the plan.",
        }

      # 3. Suitable Vehicles
      - {
          label: "Suitable Vehicles (Vehicle IDs/Slugs)",
          name: "suitableVehicles",
          widget: "list",
          required: false,
          hint: "Enter vehicle file slugs like 'sedan', 'suv', or 'tempo-traveller'",
        }

      # 4. Service-Specific FAQs
      - label: "Service FAQs"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

      # 5. Approved Tariff & Pricing Rules
      - label: "Pricing & Tariff Details"
        name: "pricing"
        widget: "object"
        required: false
        fields:
          - {
              label: "Heading / Prefix",
              name: "prefix",
              widget: "string",
              required: false,
              default: "Starting from",
              hint: "e.g., Starting from",
            }
          - {
              label: "Amount",
              name: "amount",
              widget: "string",
              required: false,
              hint: "e.g., ₹899",
            }
          - {
              label: "Short Label",
              name: "shortLabel",
              widget: "string",
              required: false,
              hint: "e.g., onwards, per trip",
            }
          - {
              label: "Unit Description",
              name: "unit",
              widget: "string",
              required: false,
              hint: "e.g., Airport to city, sedan",
            }
          - {
              label: "Last Updated Date",
              name: "lastUpdated",
              widget: "string",
              required: false,
              hint: "e.g., Jul 2026",
            }
          - {
              label: "Inclusions",
              name: "inclusions",
              widget: "list",
              required: false,
              hint: "e.g., Toll taxes, Parking fees",
            }
          - {
              label: "Exclusions",
              name: "exclusions",
              widget: "list",
              required: false,
              hint: "e.g., Monument entry fees",
            }
          - {
              label: "Booking Disclaimer / Notice",
              name: "disclaimer",
              widget: "text",
              required: false,
              default: "Sending a request does not confirm a trip. We contact you directly to confirm vehicle availability and final details.",
            }
          - {
              label: "Additional Notes",
              name: "notes",
              widget: "text",
              required: false,
            }

      # 6. Body Copy (Optional Markdown)
      - {
          label: "Body Copy (Optional Long-form Content)",
          name: "body",
          widget: "markdown",
          required: false,
        }

  - name: "vehicles"
    label: "Vehicles"
    folder: "src/content/vehicles"
    create: true
    slug: "{{slug}}"
    fields:
      - {
          label: "Title",
          name: "title",
          widget: "string",
          hint: "e.g., Sedan (Dzire / Etios) or Premium SUV (Innova Crysta)",
        }
      - {
          label: "Vehicle Image",
          name: "image",
          widget: "image",
          choose_url: false,
          required: false,
          hint: "Main photo or realistic rendering of the vehicle category",
        }
      - {
          label: "Image Note",
          name: "imageNote",
          widget: "select",
          options: ["Actual Vehicle", "Representative Vehicle"],
          hint: "Clarifies to guests whether the image is the exact cab or a model representative",
        }
      - {
          label: "Passengers",
          name: "passengers",
          widget: "number",
          hint: "Max comfortable passenger capacity (e.g., 4, 6, 12)",
        }
      - {
          label: "Luggage Count",
          name: "luggage",
          widget: "number",
          hint: "Recommended large bags capacity (e.g., 3, 5, 10)",
        }
      - {
          label: "Total Seats",
          name: "seats",
          widget: "number",
          required: false,
          hint: "Total seat count in vehicle (e.g., 5, 7, 13)",
        }
      - {
          label: "Amenities",
          name: "amenities",
          widget: "list",
          hint: "Add feature badges like 'Air Conditioned', 'Pushback Seats', 'Music System', 'Carrier'",
        }
      - {
          label: "Summary",
          name: "summary",
          widget: "text",
          hint: "Overview paragraph describing ideal use cases (e.g. couples, family sightseeing, large groups)",
        }
      - {
          label: "Sort Order",
          name: "sortOrder",
          widget: "number",
          default: 10,
          hint: "Lower numbers appear first on the vehicle fleet page",
        }
      - {
          label: "Published",
          name: "published",
          widget: "boolean",
          default: true,
        }

  - name: "faqs"
    label: "FAQs"
    folder: "src/content/faqs"
    create: true
    slug: "{{slug}}"
    fields:
      - {
          label: "Question",
          name: "question",
          widget: "string",
          hint: "Keep under 120 characters for clean display on mobile accordions",
        }
      - { label: "Answer", name: "answer", widget: "text" }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options:
            [
              "General & Booking",
              "Pricing & Tariffs",
              "Vehicles & Drivers",
              "Outstation Routes",
            ],
          default: "General & Booking",
        }
      - {
          label: "Order",
          name: "sortOrder",
          widget: "number",
          default: 10,
          hint: "Lower numbers (1, 2, 3) appear higher in the FAQ accordion",
        }
      - {
          label: "Published",
          name: "published",
          widget: "boolean",
          default: true,
        }

  - name: "reviews"
    label: "Reviews"
    folder: "src/content/reviews"
    create: true
    slug: "{{slug}}"
    fields:
      - {
          label: "Author Name",
          name: "author",
          widget: "string",
          hint: "e.g., 'Rahul & Family' or 'Ananya Sharma'",
        }
      - {
          label: "Location / Subtext",
          name: "location",
          widget: "string",
          default: "Verified Traveller",
          hint: "e.g., 'Verified Traveller' or 'Visitor from Mumbai'",
        }
      - {
          label: "Service Used",
          name: "service",
          widget: "string",
          hint: "e.g., 'Udaipur Airport Transfer' or '3-Day Rajasthan Tour'",
        }
      - {
          label: "Rating (1-5)",
          name: "rating",
          widget: "number",
          default: 5,
          min: 1,
          max: 5,
        }
      - {
          label: "Date",
          name: "date",
          widget: "string",
          hint: "e.g., 'July 2026' or 'Last Friday'",
        }
      - { label: "Comment", name: "comment", widget: "text" }
      - {
          label: "Image",
          name: "image",
          widget: "image",
          choose_url: false,
          required: false,
          hint: "Optional customer or trip photograph",
        }
      - {
          label: "Verified Badge",
          name: "verified",
          widget: "boolean",
          default: true,
        }
      - {
          label: "Featured on Home",
          name: "featured",
          widget: "boolean",
          default: true,
          hint: "If true, displays on the home page testimonial section",
        }
      - {
          label: "Sort Order",
          name: "sortOrder",
          widget: "number",
          default: 10,
        }

  - name: "blog"
    label: "Blog Articles"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {
          label: "Title",
          name: "title",
          widget: "string",
          hint: "Max 100 characters for optimal SEO",
        }
      - {
          label: "Cover Image",
          name: "image",
          widget: "image",
          choose_url: false,
          required: false,
          hint: "Featured image for article headers and card previews",
        }
      - {
          label: "Summary",
          name: "summary",
          widget: "text",
          hint: "Keep under 160 characters. Displayed on article preview cards and Google search results",
        }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - {
          label: "Author",
          name: "author",
          widget: "string",
          default: "Transport Editorial Team",
        }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options:
            [
              "Vehicle Guide",
              "Airport Transfers",
              "Pricing & Quotes",
              "Travel Tips",
            ],
        }
      - {
          label: "Related Service (Slug)",
          name: "relatedService",
          widget: "string",
          required: false,
          hint: "Enter the file slug of a service (e.g., 'udaipur-airport-transfer') to cross-link it at the end of this blog post!",
        }
      - {
          label: "Published",
          name: "published",
          widget: "boolean",
          default: true,
        }
      - {
          label: "Featured Article",
          name: "featured",
          widget: "boolean",
          default: false,
          hint: "Highlight as a featured post on the blog index",
        }
      - { label: "Body Content", name: "body", widget: "markdown" }
