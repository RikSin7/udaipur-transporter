backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images"
public_folder: "../../assets/images"

collections:
  # ----------------------------------------
  # 1. PAGES (Singleton Pages & Settings)
  # ----------------------------------------
  - name: "pages"
    label: "Pages & Settings"
    files:
      - name: "home"
        label: "Home Page"
        file: "src/content/home/home.md"
        fields:
          - {
              label: "Hero Badge Text",
              name: "heroBadge",
              widget: "string",
              default: "Private transport from Udaipur",
            }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - {
              label: "Hero CTA Button Text",
              name: "heroCtaText",
              widget: "string",
              default: "Request Travel Quote",
            }
          - {
              label: "Hero WhatsApp Button Text",
              name: "heroWhatsappText",
              widget: "string",
              default: "WhatsApp Us",
            }
          - label: "Hero Bottom Features"
            name: "heroFeatures"
            widget: "list"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  [
                    "IconCar",
                    "IconMapPin",
                    "IconPhoneCall",
                    "IconShieldCheck",
                    "IconFileDescription",
                    "IconLuggage",
                    "IconPhoneCalling",
                    "IconFileText",
                    "IconBrandWhatsapp",
                    "IconFileCheck",
                    "IconCheck",
                    "IconStar",
                    "IconCompass",
                    "IconHelpCircle",
                    "IconBuildingArch",
                    "IconClock",
                  ]
              - { label: "Text", name: "text", widget: "string" }

          - {
              label: "Why Choose Us Badge",
              name: "whyChooseUsBadge",
              widget: "string",
              default: "Our Promise",
            }
          - {
              label: "Why Choose Us Heading",
              name: "whyChooseUsHeading",
              widget: "string",
              default: "Why Travellers Choose Us",
            }
          - label: "Why Choose Us Points"
            name: "whyChooseUsItems"
            widget: "list"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  [
                    "IconFileDescription",
                    "IconLuggage",
                    "IconPhoneCalling",
                    "IconShieldCheck",
                    "IconCar",
                    "IconMapPin",
                    "IconPhoneCall",
                    "IconFileText",
                    "IconBrandWhatsapp",
                    "IconFileCheck",
                    "IconCheck",
                    "IconStar",
                    "IconCompass",
                    "IconHelpCircle",
                    "IconBuildingArch",
                    "IconClock",
                  ]
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - {
                  label: "Bottom Badge Text",
                  name: "badgeText",
                  widget: "string",
                  required: false,
                }

          - {
              label: "Booking Process Badge",
              name: "bookingBadge",
              widget: "string",
              default: "How to reach us",
            }
          - {
              label: "Booking Process Heading",
              name: "bookingHeading",
              widget: "string",
              default: "Three easy ways to enquire",
            }
          - label: "Contact Method Cards"
            name: "contactMethods"
            widget: "list"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  [
                    "IconFileText",
                    "IconBrandWhatsapp",
                    "IconPhoneCall",
                    "IconPhoneCalling",
                    "IconCar",
                    "IconMapPin",
                    "IconShieldCheck",
                    "IconCheck",
                    "IconStar",
                    "IconCompass",
                    "IconHelpCircle",
                    "IconBuildingArch",
                    "IconClock",
                  ]
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Button Text", name: "ctaText", widget: "string" }
              - {
                  label: "Button Link (Use #whatsapp or #call for automatic phone routing)",
                  name: "ctaLink",
                  widget: "string",
                  hint: "Use #whatsapp to link to automatic WhatsApp chat, #call to dial business phone, or a path like /contact/",
                }

          - {
              label: "Workflow Banner Heading",
              name: "workflowHeading",
              widget: "string",
              default: "What happens after you send a request",
            }
          - label: "Workflow Steps"
            name: "workflowSteps"
            widget: "list"
            fields:
              - { label: "Step Number", name: "stepNumber", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

          - {
              label: "Bottom Enquiry Badge",
              name: "enquiryBadge",
              widget: "string",
              default: "Direct Local Booking",
            }
          - {
              label: "Bottom Enquiry Title",
              name: "enquiryTitle",
              widget: "string",
              default: "Request Your Transport Quote",
            }
          - {
              label: "Bottom Enquiry Description",
              name: "enquiryDesc",
              widget: "text",
            }

          - label: "Homepage Section Headers"
            name: "servicesSection"
            widget: "object"
            required: true
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - name: "vehiclesSection"
            label: "Vehicles Section Header"
            widget: "object"
            required: true
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - name: "blogSection"
            label: "Blog / Trip Plan Section Header"
            widget: "object"
            required: true
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - name: "reviewsSection"
            label: "Reviews Section Header"
            widget: "object"
            required: false
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - name: "faqSection"
            label: "FAQ Section Header"
            widget: "object"
            required: false
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

      - name: "about"
        label: "About Page"
        file: "src/content/about/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - {
              label: "Hero Badge",
              name: "badge",
              widget: "string",
              required: false,
              default: "Our Identity & Approach",
            }
          - { label: "Story Badge", name: "storyBadge", widget: "string" }
          - { label: "Story Heading", name: "storyHeading", widget: "string" }
          - {
              label: "Story Enquiry Button Text",
              name: "storyEnquiryBtnText",
              widget: "string",
              required: false,
              default: "Send Travel Enquiry",
            }
          - {
              label: "Story WhatsApp Button Text",
              name: "storyWhatsappBtnText",
              widget: "string",
              required: false,
              default: "Chat With Us",
            }
          - {
              label: "Page Image",
              name: "image",
              widget: "image",
              choose_url: false,
              required: false,
              hint: "Optional featured image for the about page",
            }
          - {
              label: "How We Work Badge",
              name: "howWeWorkBadge",
              widget: "string",
              required: false,
              default: "Operational Standards",
            }
          - {
              label: "How We Work Heading",
              name: "howWeWorkHeading",
              widget: "string",
            }
          - label: "How We Work Items"
            name: "howWeWork"
            widget: "list"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  [
                    "IconFileCheck",
                    "IconCar",
                    "IconPhoneCall",
                    "IconShieldCheck",
                    "IconMapPin",
                    "IconBrandWhatsapp",
                    "IconLuggage",
                    "IconPhoneCalling",
                    "IconFileText",
                    "IconCheck",
                    "IconStar",
                    "IconCompass",
                    "IconHelpCircle",
                    "IconBuildingArch",
                    "IconClock",
                    "IconSparkles",
                  ]
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - {
              label: "Coverage Badge",
              name: "coverageBadge",
              widget: "string",
              required: false,
              default: "Service Area",
            }
          - {
              label: "Coverage Heading",
              name: "coverageHeading",
              widget: "string",
            }
          - {
              label: "Coverage Subtitle",
              name: "coverageSubtitle",
              widget: "text",
            }
          - {
              label: "Coverage Locations",
              name: "coverageLocations",
              widget: "list",
            }
          - {
              label: "Ecosystem Badge",
              name: "ecosystemBadge",
              widget: "string",
              required: false,
              default: "Next Steps & Resources",
            }
          - {
              label: "Ecosystem Heading",
              name: "ecosystemHeading",
              widget: "string",
              required: false,
              default: "Explore Our Transport Ecosystem",
            }
          - {
              label: "Ecosystem Description",
              name: "ecosystemDescription",
              widget: "text",
              required: false,
              default: "Verify our customer feedback, review available transport packages, or reach out directly to plan your Udaipur itinerary.",
            }
          - label: "Ecosystem Cards"
            name: "ecosystemCards"
            widget: "list"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  [
                    "IconCar",
                    "IconShieldCheck",
                    "IconPhoneCall",
                    "IconFileCheck",
                    "IconMapPin",
                    "IconBrandWhatsapp",
                    "IconLuggage",
                    "IconPhoneCalling",
                    "IconFileText",
                    "IconCheck",
                    "IconStar",
                    "IconCompass",
                    "IconHelpCircle",
                    "IconBuildingArch",
                    "IconClock",
                    "IconSparkles",
                  ]
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Link URL", name: "link", widget: "string" }
              - { label: "Link Text", name: "linkText", widget: "string" }
          - { label: "Body Copy", name: "body", widget: "markdown" }

      - name: "settings"
        label: "Site Settings"
        file: "src/content/settings/site.md"
        fields:
          - {
              label: "Site Logo",
              name: "logo",
              widget: "image",
              required: false,
              choose_url: false,
              hint: "Upload an image (PNG/JPG/WebP) or an SVG file",
              media_folder: "src/assets",
              public_folder: "../../assets",
            }
          - {
              label: "Site Favicon",
              name: "favicon",
              widget: "image",
              required: false,
              choose_url: false,
              hint: "Upload a favicon (PNG/SVG/ICO)",
              media_folder: "public",
              public_folder: "/",
            }
          - { label: "Company Name", name: "companyName", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "WhatsApp Number", name: "whatsapp", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - {
              label: "Operating Hours",
              name: "operatingHours",
              widget: "string",
            }
          - { label: "Service Area", name: "serviceArea", widget: "string" }
          - {
              label: "Default SEO Title",
              name: "seoDefaultTitle",
              widget: "string",
            }
          - {
              label: "Default SEO Description",
              name: "seoDefaultDesc",
              widget: "text",
            }
          - {
              label: "Default SEO / Social Share Image",
              name: "seoDefaultImage",
              widget: "image",
              required: false,
              choose_url: false,
              hint: "Recommended image size: 1200x630 (JPG/PNG) for WhatsApp, Facebook & X previews.",
              media_folder: "public",
              public_folder: "/",
            }
          - label: "Social Media Platform Links"
            name: "socialLinks"
            widget: "object"
            required: false
            fields:
              - {
                  label: "Facebook Page URL",
                  name: "facebook",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Instagram URL",
                  name: "instagram",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "TripAdvisor Review URL",
                  name: "tripadvisor",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Google Business Maps Profile",
                  name: "googleMaps",
                  widget: "string",
                  required: false,
                }
          - {
              label: "Footer Tagline",
              name: "footerTagline",
              widget: "string",
              required: false,
            }
          - {
              label: "Footer Legal Disclaimer",
              name: "footerDisclaimer",
              widget: "text",
              required: false,
            }
          - label: "Site Announcement Bar"
            name: "announcementBar"
            widget: "object"
            required: false
            fields:
              - {
                  label: "Enable Announcement Bar",
                  name: "enabled",
                  widget: "boolean",
                  default: false,
                }
              - {
                  label: "Announcement Text",
                  name: "text",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Button / Link URL",
                  name: "link",
                  widget: "string",
                  required: false,
                }

      - name: "contact"
        label: "Contact Page"
        file: "src/content/contact/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - {
              label: "Direct Channels Heading",
              name: "directChannelsHeading",
              widget: "string",
            }
          - {
              label: "Direct Channels Subheading (Badge)",
              name: "directChannelsSubheading",
              widget: "string",
              required: false,
              default: "Direct Connect",
            }
          - {
              label: "Direct Channels Description",
              name: "directChannelsDesc",
              widget: "text",
            }
          - label: "Phone Card Details"
            name: "phoneCard"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Badge Text", name: "badgeText", widget: "string" }
          - label: "WhatsApp Card Details"
            name: "whatsappCard"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Badge Text", name: "badgeText", widget: "string" }
          - label: "Email Card Details"
            name: "emailCard"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Badge Text", name: "badgeText", widget: "string" }
          - {
              label: "Location Heading",
              name: "locationHeading",
              widget: "string",
            }
          - {
              label: "Location Subheading",
              name: "locationSubheading",
              widget: "string",
            }
          - {
              label: "Location Description",
              name: "locationDesc",
              widget: "text",
            }
          - {
              label: "Google Maps Embed URL",
              name: "googleMapsUrl",
              widget: "string",
            }
          - {
              label: "Body Copy",
              name: "body",
              widget: "markdown",
              required: false,
            }

      - name: "privacy"
        label: "Privacy Policy"
        file: "src/content/privacy/privacy.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - {
              label: "Last Updated Date",
              name: "lastUpdated",
              widget: "string",
            }
          - { label: "Policy Content", name: "body", widget: "markdown" }

      - name: "terms"
        label: "Terms of Service"
        file: "src/content/terms/terms.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - {
              label: "Last Updated Date",
              name: "lastUpdated",
              widget: "string",
            }
          - { label: "Terms Content", name: "body", widget: "markdown" }

  # ----------------------------------------
  # 2. ARCHIVE & SYSTEM PAGES
  # ----------------------------------------
  - name: "archive_pages"
    label: "Archive & System Pages"
    files:
      - name: "services_hub"
        label: "Services Catalogue Page (/services)"
        file: "src/content/services_hub/services_hub.md"
        fields:
          - { label: "SEO Title", name: "seoTitle", widget: "string" }
          - { label: "SEO Description", name: "seoDesc", widget: "text" }
          - { label: "Hero Badge", name: "badge", widget: "string" }
          - { label: "Hero Title", name: "title", widget: "string" }
          - { label: "Hero Description", name: "description", widget: "text" }
          - {
              label: "Footer Disclaimer Paragraph",
              name: "disclaimerText",
              widget: "text",
            }
          - label: "Service Categories Configuration"
            name: "categories"
            widget: "list"
            min: 5
            max: 5
            add_to_top: false
            label_singleton: "Category"
            fields:
              - {
                  label: "Category Name (Read-Only)",
                  name: "name",
                  widget: "string",
                  disabled: true,
                  readonly: true,
                  hint: "Fixed category name. This is read-only because service pages rely on these exact hardcoded options.",
                }
              - { label: "Category Subtitle", name: "subtitle", widget: "text" }
              - {
                  label: "Category Icon",
                  name: "icon",
                  widget: "select",
                  options:
                    [
                      "IconPlane",
                      "IconMapPin",
                      "IconCompass",
                      "IconUsers",
                      "IconPlus",
                      "IconCar",
                      "IconBus",
                      "IconRoad",
                      "IconMap",
                      "IconNavigation",
                      "IconTrain",
                      "IconShieldCheck",
                      "IconAward",
                      "IconPhoneCall",
                      "IconBrandWhatsapp",
                      "IconSparkles",
                      "IconBriefcase",
                      "IconCalendarEvent",
                    ],
                  default: "IconCar",
                }

      - name: "vehicles_hub"
        label: "Vehicles Fleet Page (/vehicles)"
        file: "src/content/vehicles_hub/vehicles_hub.md"
        fields:
          - { label: "SEO Title", name: "seoTitle", widget: "string" }
          - { label: "SEO Description", name: "seoDesc", widget: "text" }
          - { label: "Hero Badge", name: "badge", widget: "string" }
          - { label: "Hero Title", name: "title", widget: "string" }
          - { label: "Hero Description", name: "description", widget: "text" }

      - name: "reviews_hub"
        label: "Reviews Page (/reviews)"
        file: "src/content/reviews_hub/reviews_hub.md"
        fields:
          - { label: "SEO Title", name: "seoTitle", widget: "string" }
          - { label: "SEO Description", name: "seoDesc", widget: "text" }
          - { label: "Hero Badge", name: "badge", widget: "string" }
          - { label: "Hero Title", name: "title", widget: "string" }
          - { label: "Hero Description", name: "description", widget: "text" }

      - name: "blog_hub"
        label: "Blog Index Page (/blog)"
        file: "src/content/blog_hub/blog_hub.md"
        fields:
          - { label: "SEO Title", name: "seoTitle", widget: "string" }
          - { label: "SEO Description", name: "seoDesc", widget: "text" }
          - { label: "Hero Badge", name: "badge", widget: "string" }
          - { label: "Hero Title", name: "title", widget: "string" }
          - { label: "Hero Description", name: "description", widget: "text" }
          - {
              label: "Conversion Banner Heading",
              name: "bannerHeading",
              widget: "string",
              required: false,
              default: "Ready to book your vehicle?",
            }
          - {
              label: "Conversion Banner Description",
              name: "bannerDesc",
              widget: "text",
              required: false,
              default: "Skip the guesswork. Share your travel dates and passenger count for a straightforward, owner-approved price quote.",
            }
          - {
              label: "Conversion Banner Button Text",
              name: "bannerButtonText",
              widget: "string",
              required: false,
              default: "View Transport Services",
            }
          - {
              label: "Conversion Banner Button URL",
              name: "bannerButtonUrl",
              widget: "string",
              required: false,
              default: "/services/",
            }
          - {
              label: "Conversion Banner WhatsApp Button Text",
              name: "bannerWhatsappText",
              widget: "string",
              required: false,
              default: "Ask a Question on WhatsApp",
            }

      - name: "faqs_hub"
        label: "FAQs Page (/faqs)"
        file: "src/content/faqs_hub/faqs_hub.md"
        fields:
          - { label: "SEO Title", name: "seoTitle", widget: "string" }
          - { label: "SEO Description", name: "seoDesc", widget: "text" }
          - { label: "Hero Badge", name: "badge", widget: "string" }
          - { label: "Hero Title", name: "title", widget: "string" }
          - { label: "Hero Description", name: "description", widget: "text" }

      - name: "thank_you"
        label: "Thank You Page (/thank-you)"
        file: "src/content/thank_you/thank_you.md"
        fields:
          - { label: "SEO Title", name: "seoTitle", widget: "string" }
          - { label: "SEO Description", name: "seoDesc", widget: "text" }
          - { label: "Page Heading", name: "title", widget: "string" }
          - { label: "Confirmation Message", name: "message", widget: "text" }
          - {
              label: "Return Button Text",
              name: "buttonText",
              widget: "string",
            }

      - name: "catalogue_cta"
        label: "Catalogue Cross-Selling Consultation Banners"
        file: "src/content/catalogue_cta/catalogue_cta.md"
        fields:
          - {
              label: "Services Page -> Vehicle Cross-Link Badge",
              name: "servicesCrossBadge",
              widget: "string",
            }
          - {
              label: "Services Page -> Vehicle Cross-Link Title",
              name: "servicesCrossTitle",
              widget: "string",
            }
          - {
              label: "Services Page -> Vehicle Cross-Link Description",
              name: "servicesCrossDesc",
              widget: "text",
            }
          - {
              label: "Services Page -> Consultation Badge",
              name: "servicesInquiryBadge",
              widget: "string",
            }
          - {
              label: "Services Page -> Consultation Title",
              name: "servicesInquiryTitle",
              widget: "string",
            }
          - {
              label: "Services Page -> Consultation Description",
              name: "servicesInquiryDesc",
              widget: "text",
            }
          - {
              label: "Vehicles Page -> Service Cross-Link Badge",
              name: "vehiclesCrossBadge",
              widget: "string",
            }
          - {
              label: "Vehicles Page -> Service Cross-Link Title",
              name: "vehiclesCrossTitle",
              widget: "string",
            }
          - {
              label: "Vehicles Page -> Service Cross-Link Description",
              name: "vehiclesCrossDesc",
              widget: "text",
            }
          - {
              label: "Vehicles Page -> Consultation Badge",
              name: "vehiclesInquiryBadge",
              widget: "string",
            }
          - {
              label: "Vehicles Page -> Consultation Title",
              name: "vehiclesInquiryTitle",
              widget: "string",
            }
          - {
              label: "Vehicles Page -> Consultation Description",
              name: "vehiclesInquiryDesc",
              widget: "text",
            }

      - name: "direct_contact_cta"
        label: "Direct Contact / Assistance Banners (FAQs & Reviews)"
        file: "src/content/direct_contact_cta/direct_contact_cta.md"
        fields:
          - { label: "FAQs Page -> Badge", name: "faqsBadge", widget: "string" }
          - { label: "FAQs Page -> Title", name: "faqsTitle", widget: "string" }
          - {
              label: "FAQs Page -> Description",
              name: "faqsDesc",
              widget: "text",
            }
          - {
              label: "Reviews Page -> Badge",
              name: "reviewsBadge",
              widget: "string",
            }
          - {
              label: "Reviews Page -> Title",
              name: "reviewsTitle",
              widget: "string",
            }
          - {
              label: "Reviews Page -> Description",
              name: "reviewsDesc",
              widget: "text",
            }

      - name: "blog_cta"
        label: "Blog Details Page Consultation Banner"
        file: "src/content/blog_cta/blog_cta.md"
        fields:
          - { label: "Banner Badge", name: "badge", widget: "string" }
          - { label: "Banner Title", name: "title", widget: "string" }
